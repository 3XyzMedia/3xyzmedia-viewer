name: Build EMELYA LOD
on:
  push:
    paths:
      - '.github/workflows/build-emelya-lod.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CPU-backed Vulkan for Gaussian merging
        run: |
          npm install --prefix "$RUNNER_TEMP/gpu" @sparticuz/chromium@153.0.0
          node -e "const fs=require('fs'),z=require('zlib');fs.writeFileSync(process.env.RUNNER_TEMP+'/swiftshader.tar',z.brotliDecompressSync(fs.readFileSync(process.env.RUNNER_TEMP+'/gpu/node_modules/@sparticuz/chromium/bin/swiftshader.tar.br')))"
          tar -xf "$RUNNER_TEMP/swiftshader.tar" -C "$RUNNER_TEMP"
          echo "VK_ICD_FILENAMES=$RUNNER_TEMP/vk_swiftshader_icd.json" >> "$GITHUB_ENV"
      - name: Merge LODs for current models and write manifests
        run: |
          python3 - <<'PY'
          import json, struct, subprocess, os
          from pathlib import Path
          def read(p):
              b=Path(p).read_bytes(); end=b.index(b'end_header\n')+11
              lines=b[:end].decode('ascii').splitlines()
              n=int(next(x.split()[2] for x in lines if x.startswith('element vertex ')))
              chunks=int(next(x.split()[2] for x in lines if x.startswith('element chunk ')))
              start=next(i for i,x in enumerate(lines) if x.startswith('element chunk '))
              props=[]
              for line in lines[start+1:]:
                  if line.startswith('element '): break
                  if line.startswith('property '): props.append(line.split()[-1])
              stride=len(props)*4
              a=[struct.unpack_from('<'+str(len(props))+'f',b,end+i*stride) for i in range(chunks)]
              lo=[min(x[props.index('min_'+d)] for x in a) for d in 'xyz']
              hi=[max(x[props.index('max_'+d)] for x in a) for d in 'xyz']
              assert len(b)>=end+chunks*stride+n*16
              return n,lo,hi
          cli=['npx','--yes','@playcanvas/splat-transform@3.10.3']
          for source in sorted(Path('model').glob('*.ply')):
              count,lo,hi=read(source)
              if count<1024: continue
              dest=Path('model/lod')/source.stem; dest.mkdir(parents=True,exist_ok=True)
              levels=[dict(url=source.name,count=count)]
              for i,want in enumerate([max(256,min(250000,count//4)),max(64,min(62500,count//16))],1):
                  temp=Path(os.environ['RUNNER_TEMP'])/('lod'+str(i)+'.ply')
                  output=dest/f'LOD{i}.compressed.ply'
                  subprocess.run(cli+[str(source),'--decimate',str(want),str(temp)],check=True)
                  subprocess.run(cli+[str(temp),str(output)],check=True)
                  n,l,h=read(output); assert n==want,(n,want)
                  assert all(l[d]>=lo[d]-(hi[d]-lo[d])*.15-1e-6 and h[d]<=hi[d]+(hi[d]-lo[d])*.15+1e-6 for d in range(3))
                  levels.append(dict(url=output.relative_to(source.parent).as_posix(),count=n))
              manifest=dict(version=1,source=source.name,bounds=dict(min=lo,max=hi),levels=levels)
              source.with_suffix('.lod.json').write_text(json.dumps(manifest,indent=2)+'\n')
              print(json.dumps(manifest,indent=2))
          PY
      - name: Publish generated levels
        run: |
          git config user.name "3XyzMedia LOD Builder"
          git config user.email "lod-builder@users.noreply.github.com"
          git add model/lod model/*.lod.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate EMELYA 250K and 62.5K LOD assets"
          git pull --rebase origin main
          git push origin main
